<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jonathan Steadman — Desktop</title> <!-- Change title appropriately -->
  <link rel="icon" type="image/png" href="Assets/icon.png">
  <link rel="stylesheet" href="os.css">
</head>
<body>
<div class="desktop">

  <div class="desktop-icons">
    <div class="desktop-icon" data-app="home"><div class="icon-img">🏠</div><span>Home</span></div>
    <div class="desktop-icon" data-app="sysinfo"><div class="icon-img">🖥️</div><span>System Info</span></div>
    <div class="desktop-icon" data-app="education"><div class="icon-img">🎓</div><span>Education</span></div>
    <div class="desktop-icon" data-url="https://github.com/ToothedTomb"><div class="icon-img">🐙</div><span>GitHub</span></div>
    <div class="desktop-icon" data-url="https://jonathan-linux.itch.io/"><div class="icon-img">🎮</div><span>itch.io</span></div>
    <div class="desktop-icon" data-url="https://www.youtube.com/@JonathanSteadman2003"><div class="icon-img">▶️</div><span>YouTube</span></div>
    <div class="desktop-icon" data-url="https://www.linkedin.com/in/jonathan-steadman-b4846a19b/"><div class="icon-img">💼</div><span>LinkedIn</span></div>
  </div>

  <div id="window-layer"></div>

  <div id="taskbar">
    <button id="start-btn"> <span>Menu</span></button>
    <div id="taskbar-apps"></div>
    <div id="taskbar-clock"></div>
  </div>

  <div id="start-menu" class="hidden">
    <div class="start-header">Jonathan OS</div>
    <div class="start-item" data-app="home">🏠 Home</div>
    <div class="start-item" data-app="sysinfo">🖥️ My System Information</div>
    <div class="start-item" data-app="education">🎓 My Education</div>
    <div class="start-divider"></div>
    <div class="start-item" data-url="https://github.com/ToothedTomb">🐙 GitHub</div>
    <div class="start-item" data-url="https://jonathan-linux.itch.io/">🎮 itch.io</div>
    <div class="start-item" data-url="https://www.youtube.com/@JonathanSteadman2003">▶️ YouTube</div>
    <div class="start-item" data-url="https://www.linkedin.com/in/jonathan-steadman-b4846a19b/">💼 LinkedIn</div>
    <div class="start-item" data-app="game">🏎️ Vibe Coded Car Game</div>
  </div>

</div>
<script src="os.js"></script>
</body>
</html>
